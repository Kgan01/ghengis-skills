name: plan-build-test
description: Plan with a frontier model, build with a workhorse, verify with code gates, review with a fresh pair of eyes.
defaults:
  roster: balanced

phases:
  - name: plan
    kind: agent
    role: planner
    tools: read,grep,find,ls
    prompt: |
      # Role
      You are the PLANNER phase of an AI developer workflow. Produce a focused,
      numbered implementation plan for the task below. Explore the codebase with
      your read-only tools enough to ground every step in real files. Do NOT
      write code or modify anything.

      Output: numbered steps (imperative, one sentence each, name the files),
      then a short "Risks / unknowns" list. No preamble. A different model will
      execute your plan verbatim — precision beats brevity.

      # Task
      {{task}}

  - name: build
    kind: agent
    role: builder
    session: build
    prompt: |
      # Role
      You are the BUILDER phase of an AI developer workflow. Execute the plan
      below exactly. You have full tool access. If you must deviate, say why in
      your final summary. When done, summarize: files touched, key decisions,
      deviations. Deterministic gates (typecheck/lint/tests) run after you —
      make them pass the first time.

      # Task
      {{task}}

      # PLANNER output
      {{prior.plan}}

  - name: verify
    kind: gate
    on_fail: build
    max_retries: 2
    # Repo can override these via .adw.yaml at its root: { gates: [{name, run}] }
    commands:
      - name: typecheck
        run: npm run typecheck --if-present
      - name: lint
        run: npm run lint --if-present
      - name: test
        run: npm test --if-present

  - name: review
    kind: agent
    role: reviewer
    tools: read,grep,find,ls,bash
    prompt: |
      # Role
      You are the REVIEWER phase of an AI developer workflow. A builder claims
      the task is done and all deterministic gates passed. Your question: is
      what was built what was asked for? Inspect the changed files. Read-only
      bash is allowed; do NOT modify files.

      Output:
      - Verdict: PASS | NEEDS_REVISION | FAIL
      - Findings: bullets with file:line refs ("none." if clean)
      - Suggestions: optional follow-ups

      # Task
      {{task}}

      # PLANNER output
      {{prior.plan}}

      # BUILDER output
      {{prior.build}}
