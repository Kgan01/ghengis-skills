# Model rosters — which model plays which role, per spend/quality profile.
# Model refs: <provider>/<id>[:thinking]. Change models HERE, never in code.
#
# Providers in the quad:
#   claude-cli/*    Claude Code native agents ($0 on Max)
#   openai-codex/*  `codex exec` on the ChatGPT Pro subscription
#   google/*        `agy` (Antigravity) on the AI Pro subscription. Use the ALIASES
#                   flash / flash-low / flash-high / pro / pro-medium — agy-call.ps1
#                   resolves them against the live `agy models` list, so a new
#                   Gemini release needs no edit here.
#
# Dan's rule of thumb: frontier model plans + reviews (nothing gets missed),
# workhorse builds (cheap, fast), gates are code (free).

#
# DEFAULT DOCTRINE (2026-08-10): QUALITY FIRST.
# The plans are paid for — Claude Max $200 (unmetered), ChatGPT Pro 5x, Google
# AI Pro. Spending a cheap model to save quota that expires unused is a false
# economy. So: frontier models do the thinking, cheap models execute work that
# is ALREADY fully specified, and a higher-tier reviewer always checks them.
# `quality` is the default roster; `balanced`/`budget` are deliberate downgrades.

rosters:
  # DEFAULT. Claude does the heavy lifting (unmetered $200 plan), codex gets
  # real building work (5x plan sits idle otherwise), Opus reviews everything.
  quality:
    planner:  { model: "claude-cli/fable" }
    builder:  { model: "openai-codex/gpt-6-astra" }
    reviewer: { model: "claude-cli/opus" }

  # Pre-specified mechanical work: the task is already decided, a fast model
  # types it, and a frontier reviewer verifies correctness. The user's pattern:
  # "just go do it as I said, then have Opus review it."
  specd:
    planner:  { model: "claude-cli/haiku" }
    builder:  { model: "google/flash" }
    reviewer: { model: "claude-cli/opus" }

  # Max quality — critical or gnarly work. Fable plans (best model there is),
  # Sol builds, Opus reviews (senior second pair of Claude eyes).
  frontier:
    planner:  { model: "claude-cli/fable" }
    builder:  { model: "openai-codex/gpt-6-astra" }
    reviewer: { model: "claude-cli/opus" }

  # All-OpenAI rail — GPT-6 Astra in every seat, effort varies by role (the
  # 5.6 sol/terra/luna line is "older generation" since 2026-10). Use when
  # Claude quota is precious or Gemini is limited.
  gpt:
    planner:  { model: "openai-codex/gpt-6-astra", thinking: high }
    builder:  { model: "openai-codex/gpt-6-astra", thinking: medium }
    reviewer: { model: "openai-codex/gpt-6-astra", thinking: high }

  # Default — frontier ends, workhorse middle. Saves Claude/Max quota.
  balanced:
    planner:  { model: "openai-codex/gpt-6-astra", thinking: high }
    builder:  { model: "google/flash" }
    reviewer: { model: "claude-cli/sonnet" }

  # Cheap — chores, docs, mechanical edits. No Claude quota burned at all.
  budget:
    planner:  { model: "google/pro" }
    builder:  { model: "google/flash" }
    # All-Gemini so the cheap tier has no cross-provider dependency
    # (Codex quota exhaustion would otherwise strand it at review).
    reviewer: { model: "google/flash-low" }

  # Two frontier models debate the plan (pingpong-plan-build workflow),
  # a workhorse builds, Sonnet reviews. The heavyweight option.
  pingpong:
    planner_a: { model: "claude-cli/fable" }
    planner_b: { model: "openai-codex/gpt-6-astra", thinking: high }
    builder:   { model: "google/flash" }
    reviewer:  { model: "claude-cli/sonnet" }

  # $0 + private — DGX Spark via the ollama-ext extension (auto-registered
  # as provider "ollama-dgx" when the Spark is reachable on the Tailnet).
  local:
    planner:  { model: "ollama-dgx/gpt-oss:120b" }
    builder:  { model: "ollama-dgx/gpt-oss:120b" }
    reviewer: { model: "ollama-dgx/qwen3.6:35b-a3b" }
